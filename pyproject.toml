[project]
name = "uplink"
version = "0.1.0"
description = "A narrow REST server that lets the judy container act on the host"
authors = [
    { name = "karsh", email = "karshmail@icloud.com" },
]
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "colorlog>=6.12.0",
]

[project.scripts]
main = "uplink.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
