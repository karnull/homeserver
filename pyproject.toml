[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "uplink"
dynamic = ["version"]
description = "A narrow REST server that lets the judy container act on the host"
authors = [
    { name = "Karnull", email = "karshmail@icloud.com" },
]
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "docker>=7",
    "fastapi>=0.115",
    "psutil>=6",
    "uvicorn>=0.30",
]

[project.scripts]
uplink = "uplink.app:main"

# setuptools-scm reads the release tags, or the version CI passes in through the Makefile
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["uplink*"]

[tool.uv]
package = true
# rebuild the installed project when the version changes, so its metadata stays current
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { env = "SETUPTOOLS_SCM_PRETEND_VERSION" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
